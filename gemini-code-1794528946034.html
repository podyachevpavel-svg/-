  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />

    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --bg-card-hover: #273549;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      max-width: 1200px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #fff;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
    }

    .brand-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-version { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 2px 6px; border-radius: 999px; font-weight: 600; }

    .header-actions { display: flex; gap: 6px; }

    .btn-icon {
      background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
      padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s ease;
    }
    .btn-icon:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    .search-wrapper { max-width: 1200px; margin: 0 auto 10px; position: relative; }

    .search-input {
      width: 100%; background: var(--bg-secondary); border: 1.5px solid var(--border);
      color: var(--text-primary); padding: 12px 40px 12px 38px; border-radius: var(--radius-md);
      font-size: 16px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; display: none; padding: 4px; }

    .categories-bar {
      max-width: 1200px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-pill {
      white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: var(--bg-secondary);
      border: 1px solid var(--border); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; }

    /* AI WIDGET */
    .ai-widget { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 16px; }
    .ai-widget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .ai-title { font-size: 14px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .ai-input-row { display: flex; gap: 8px; }
    .ai-input { flex: 1; background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 15px; outline: none; }
    .ai-chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
    .ai-chip { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 10px; border-radius: 999px; font-size: 11px; white-space: nowrap; cursor: pointer; }
    .ai-response-box { margin-top: 8px; font-size: 13px; color: var(--text-primary); background: var(--bg-primary); padding: 10px; border-radius: var(--radius-sm); border-left: 3px solid var(--success); display: none; }

    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--text-secondary); }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

    .dish-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    .dish-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .dish-category-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
    .card-move-select { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-secondary); font-size: 11px; padding: 2px 6px; border-radius: 6px; outline: none; }

    .dish-title { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-top: 4px; }
    .dish-title.glare-blank { color: var(--warning); font-style: italic; }

    .dish-preview-ingredients { font-size: 13px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .dish-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 12px; color: var(--text-secondary); }
    .yield-badge { font-weight: 700; color: var(--success); background: rgba(16, 185, 129, 0.12); padding: 2px 8px; border-radius: 6px; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 12px; }
    .modal-backdrop.open { display: flex; }
    .modal-sheet { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow); overflow: hidden; }
    .modal-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    .modal-close { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .controls-panel { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; background: var(--bg-primary); padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border); align-items: center; justify-content: space-between; }
    .control-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    .segmented-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .segmented-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .ingredients-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .ingredients-table th { text-align: left; font-size: 12px; color: var(--text-secondary); padding: 8px; border-bottom: 1px solid var(--border); }
    .ingredients-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; }
    .ingredients-table td.weight-cell { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .section-divider-row td { background: rgba(249, 115, 22, 0.15); color: var(--accent); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

    .yield-summary-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-md); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-weight: 700; color: var(--success); }
    .tech-description { background: var(--bg-primary); border-left: 3px solid var(--accent); padding: 12px; border-radius: 0 var(--radius-md) var(--radius-md) 0; font-size: 13px; }
    .tech-description-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
    .empty-state { text-align: center; padding: 40px 16px; color: var(--text-secondary); }
  </style>
</head>

        category: "Наборы и тесто",
        title: "Набор Жаренных чеб №1 (Правый блок)",
        sizes: ["Стандарт"],
        ingredients: [
          { name: "Ветчина сыр", amounts: ["1 шт."] },

        ],
        yields: ["2 шт."],
        description: ""
      },
      {
        id: "dough-cheburek",
        category: "Наборы и тесто",
        title: "Тесто для Чебуреков",
        sizes: ["Замес"],
        ingredients: [
          { name: "Мука", amounts: ["570 гр"] },
          { name: "Соль", amounts: ["7 гр"] },
          { name: "Кипяток", amounts: ["250 гр"] },
          { name: "Масло", amounts: ["70 гр"] }
        ],
        yields: ["890 гр"],
        description: ""
      }
    ];

    const Storage = {
      KEY: 'sushi_wok_menu_v5_full',
      getAll() {
        try {
          const raw = localStorage.getItem(this.KEY);
          if (!raw) return JSON.parse(JSON.stringify(INITIAL_MENU_DATA));
          return JSON.parse(raw);
        } catch(e) {
          return JSON.parse(JSON.stringify(INITIAL_MENU_DATA));
        }
      },
      save(items) {
        localStorage.setItem(this.KEY, JSON.stringify(items));
        return items;
      },
      reset() {
        localStorage.removeItem(this.KEY);
        return JSON.parse(JSON.stringify(INITIAL_MENU_DATA));
      }
    };

    const AiAgent = {
      process(query, recipes) {
        const q = query.toLowerCase().trim();
        if (q.includes('перенеси') || q.includes('положи')) {
          let targetCat = null;
          ALL_CATEGORIES.forEach(c => { if (q.includes(c.toLowerCase())) targetCat = c; });
          if (!targetCat && q.includes('том ям')) targetCat = 'Том ям';
          if (!targetCat && q.includes('прочие')) targetCat = 'Прочие блюда';

          if (!targetCat) return { success: false, message: "Укажите раздел назначения." };

          const found = recipes.find(r => r.title && q.includes(r.title.toLowerCase()));
          if (found) {
            const old = found.category;
            found.category = targetCat;
            Storage.save(recipes);
            return { success: true, message: `✅ «${found.title}» перенесено из «${old}» в «${targetCat}»!` };
          }
          return { success: false, message: "Блюдо не найдено по имени." };
        }
        if (q.includes('покажи') || q.includes('найди') || q.includes('соусы')) {
          const match = recipes.filter(r => r.category.toLowerCase().includes('соус') || (r.title && r.title.toLowerCase().includes('соус')));
          return { success: true, message: `🥣 Найдено соусов (${match.length}): ` + match.map(m => m.title).join(', ') };
        }
        return { success: false, message: "🤖 Команда распознана. Попробуйте: 'Перенеси [Блюдо] в [Раздел]' или 'покажи соусы'." };
      }
    };

    let recipes = Storage.getAll();
    let activeCategory = 'Все';
    let searchQuery = '';
    let currentRecipe = null;
    let sizeIndex = 0;

    const els = {
      search: document.getElementById('smartSearchInput'),
      clear: document.getElementById('btnClearSearch'),
      cats: document.getElementById('categoriesBar'),
      grid: document.getElementById('cardsGrid'),
      counter: document.getElementById('resultsCounter'),
      modal: document.getElementById('recipeModal'),
      modalCat: document.getElementById('modalCategory'),
      modalTitle: document.getElementById('modalTitle'),
      modalBody: document.getElementById('modalBody'),
      closeModal: document.getElementById('btnCloseRecipeModal'),
      aiInput: document.getElementById('aiAgentInput'),
      aiSubmit: document.getElementById('aiAgentSubmit'),
      aiResponse: document.getElementById('aiResponseBox'),
      reset: document.getElementById('btnResetData'),
      export: document.getElementById('btnExportData')
    };

    function renderCats() {
      const list = ['Все', ...ALL_CATEGORIES];
      els.cats.innerHTML = list.map(c => `
        <button class="cat-pill ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</button>
      `).join('');
    }

    function renderGrid() {
      let list = activeCategory === 'Все' ? recipes : recipes.filter(r => r.category === activeCategory);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(r => (r.title && r.title.toLowerCase().includes(q)) || r.category.toLowerCase().includes(q) || r.ingredients.some(i => i.name.toLowerCase().includes(q)));
      }

      els.counter.textContent = `Позиций: ${list.length}`;

      if (list.length === 0) {
        els.grid.innerHTML = `<div class="empty-state"><h3>Ничего не найдено</h3></div>`;
        return;
      }

      els.grid.innerHTML = list.map(r => {
        const prev = r.ingredients.filter(i => !i.isDivider).map(i => i.name).join(', ');
        const hasTitle = Boolean(r.title && r.title.trim());
        const opts = ALL_CATEGORIES.map(c => `<option value="${c}" ${c === r.category ? 'selected' : ''}>${c}</option>`).join('');

        return `
          <article class="dish-card" data-id="${r.id}">
            <div>
              <div class="dish-card-header">
                <span class="dish-category-tag">${r.category}</span>
                <select class="card-move-select" data-move-id="${r.id}" onclick="event.stopPropagation()">
                  ${opts}
                </select>
              </div>
              <h3 class="dish-title ${!hasTitle ? 'glare-blank' : ''}">
                ${hasTitle ? r.title : '[Без названия / Блик]'}
              </h3>
              <p class="dish-preview-ingredients" style="margin-top: 6px;">${prev}</p>
            </div>
            <div class="dish-footer">
              <span>Размеров: ${r.sizes.length}</span>
              <span class="yield-badge">${r.yields[0]}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    function openModal(r) {
      currentRecipe = r;
      sizeIndex = 0;
      renderModalContent();
      els.modal.classList.add('open');
    }

    function renderModalContent() {
      const r = currentRecipe;
      if (!r) return;
      els.modalCat.textContent = r.category;
      const hasTitle = Boolean(r.title && r.title.trim());
      els.modalTitle.textContent = hasTitle ? r.title : '[Без названия / Блик]';

      const sizeBtns = r.sizes.map((s, idx) => `
        <button class="segmented-btn ${idx === sizeIndex ? 'active' : ''}" data-size="${idx}">${s}</button>
      `).join('');

      const rows = r.ingredients.map(i => {
        if (i.isDivider) return `<tr class="section-divider-row"><td colspan="2">${i.name}</td></tr>`;
        const val = i.amounts[sizeIndex] || i.amounts[0] || '';
        return `<tr><td>${i.name}</td><td class="weight-cell">${val}</td></tr>`;
      }).join('');

      const yieldVal = r.yields[sizeIndex] || r.yields[0] || '';

      els.modalBody.innerHTML = `
        ${r.sizes.length > 1 ? `
          <div class="controls-panel">
            <span class="control-label">Размер:</span>
            <div style="display:flex; gap:6px;">${sizeBtns}</div>
          </div>
        ` : ''}
        <table class="ingredients-table">
          <thead><tr><th>Ингредиент</th><th style="text-align:right;">Закладка</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="yield-summary-box">
          <span>Выход:</span><span>${yieldVal}</span>
        </div>
        ${r.description ? `<div class="tech-description"><div class="tech-description-title">Приготовление</div><div>${r.description}</div></div>` : ''}
      `;
    }

    els.search.addEventListener('input', e => {
      searchQuery = e.target.value;
      els.clear.style.display = searchQuery ? 'block' : 'none';
      renderGrid();
    });

    els.clear.addEventListener('click', () => {
      searchQuery = '';
      els.search.value = '';
      els.clear.style.display = 'none';
      renderGrid();
    });

    els.cats.addEventListener('click', e => {
      const pill = e.target.closest('.cat-pill');
      if (!pill) return;
      activeCategory = pill.dataset.cat;
      renderCats();
      renderGrid();
    });

    els.grid.addEventListener('change', e => {
      const sel = e.target.closest('.card-move-select');
      if (!sel) return;
      const dish = recipes.find(r => r.id === sel.dataset.moveId);
      if (dish) {
        dish.category = sel.value;
        Storage.save(recipes);
        renderGrid();
      }
    });

    els.grid.addEventListener('click', e => {
      const card = e.target.closest('.dish-card');
      if (!card) return;
      const found = recipes.find(r => r.id === card.dataset.id);
      if (found) openModal(found);
    });

    els.modalBody.addEventListener('click', e => {
      const btn = e.target.closest('[data-size]');
      if (!btn) return;
      sizeIndex = Number(btn.dataset.size);
      renderModalContent();
    });

    els.closeModal.addEventListener('click', () => els.modal.classList.remove('open'));
    els.modal.addEventListener('click', e => { if (e.target === els.modal) els.modal.classList.remove('open'); });

    function runAi() {
      const val = els.aiInput.value;
      if (!val) return;
      const res = AiAgent.process(val, recipes);
      els.aiResponse.style.display = 'block';
      els.aiResponse.textContent = res.message;
      recipes = Storage.getAll();
      renderCats();
      renderGrid();
    }

    els.aiSubmit.addEventListener('click', runAi);
    els.aiInput.addEventListener('keydown', e => { if (e.key === 'Enter') runAi(); });
    document.querySelector('.ai-chips').addEventListener('click', e => {
      const chip = e.target.closest('.ai-chip');
      if (!chip) return;
      els.aiInput.value = chip.dataset.cmd;
      runAi();
    });

    els.reset.addEventListener('click', () => {
      if (confirm('Сбросить данные?')) {
        recipes = Storage.reset();
        activeCategory = 'Все';
        renderCats();
        renderGrid();
      }
    });

    els.export.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'sushi-wok-full.json';
      a.click();
    });

    renderCats();
    renderGrid();
  </script>
</body>
